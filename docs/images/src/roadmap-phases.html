<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roadmap phases (UML-style)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --done: #34d399; --wip: #fbbf24; --plan: #60a5fa; --risk: #c084fc;
    --ink: #eaf1fb; --muted: #9fb2cc; --line: rgba(255,255,255,0.16);
  }
  body { position: relative; width: 1080px; height: 850px; font-family: 'Lato', 'DejaVu Sans', sans-serif; color: var(--ink); overflow: hidden;
    background: radial-gradient(1100px 650px at 100% -10%, #1d4a6b 0%, transparent 60%),
                radial-gradient(900px 600px at -10% 105%, #3b1f5e 0%, transparent 55%), #0b1424; }
  h1 { position: absolute; left: 40px; top: 28px; font-size: 38px; font-weight: 900; letter-spacing: -0.4px; }
  h1 span { background: linear-gradient(90deg, #7fd4ff, #34d399); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { position: absolute; left: 40px; top: 76px; color: var(--muted); font-size: 18px; }
  .mod { position: absolute; border: 2px solid var(--c); border-radius: 12px; background: rgba(10,20,36,.72); box-shadow: 0 6px 22px rgba(0,0,0,.35); }
  .mod header { height: 40px; padding: 4px 12px 0; border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0;
    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 28%, transparent), transparent 80%); position: relative; }
  .mod header i { display: block; font-style: normal; font-size: 11px; color: var(--muted); letter-spacing: .5px; line-height: 12px; }
  .mod header b { display: block; font-size: 18px; font-weight: 900; line-height: 20px; }
  .mod header svg.uml { position: absolute; right: 10px; top: 9px; width: 24px; height: 22px; }
  .body { padding: 10px; display: grid; gap: 0; }
  .body.c2 { grid-template-columns: 1fr 1fr; gap: 0 8px; }
  .body.c3 { grid-template-columns: 1fr 1fr 1fr; gap: 6px 8px; }
  .mod header b em { font-style: normal; display: inline-block; min-width: 22px; height: 22px; line-height: 22px; text-align: center; margin-right: 8px; border-radius: 50%; background: var(--c); color: #0b1424; font-size: 14px; vertical-align: 1px; }
  .grp { grid-column: span 1; }
  .gt { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); font-weight: 900; margin: 0 0 6px 2px; }
  .it { display: flex; align-items: center; gap: 8px; height: 28px; margin-bottom: 4px; padding: 0 9px 0 8px; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden;
        background: rgba(255,255,255,.07); border: 1px solid var(--line); border-left: 5px solid var(--s); border-radius: 8px; }
  .it svg { width: 17px; height: 17px; flex: none; stroke: var(--s); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .d { --s: var(--done); } .w { --s: var(--wip); } .p { --s: var(--plan); } .r { --s: var(--risk); }
  svg.links { position: absolute; left: 0; top: 0; width: 1080px; height: 850px; pointer-events: none; }
  .lbl { position: absolute; font-size: 12px; color: #cfe3ff; background: #0b1424; padding: 1px 6px; border: 1px solid var(--line); border-radius: 6px; transform: translate(-50%, -50%); white-space: nowrap; }
  .legend { position: absolute; left: 40px; bottom: 22px; display: flex; gap: 22px; font-size: 15px; color: var(--muted); align-items: center; }
  .legend i { display: inline-block; width: 13px; height: 13px; border-radius: 4px; margin-right: 7px; vertical-align: -1px; }
  .legend .ln { display: inline-block; width: 30px; border-top: 2px solid #7fd4ff; margin-right: 7px; vertical-align: 3px; }
  .legend .ln.dash { border-top-style: dashed; }
</style>
</head>
<body>
<h1>Roadmap <span>phases</span></h1>
<p class="sub">Eight phases from trustworthy data to the quality of a heat-treated part.</p>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="doc" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 13h7M9 17h7"/></symbol>
    <symbol id="table" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 5v14"/></symbol>
    <symbol id="curve" viewBox="0 0 24 24"><path d="M3 4v16h18"/><path d="M6 8c5 0 4 8 9 8s3-5 6-5"/></symbol>
    <symbol id="scan" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M4 12h16"/></symbol>
    <symbol id="cli" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10l3 2-3 2M12 15h5"/></symbol>
    <symbol id="api" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 5l-4 14"/></symbol>
    <symbol id="gui" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></symbol>
    <symbol id="review" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></symbol>
    <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
    <symbol id="brain" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V4a3 3 0 0 0-3 0z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6 8h12v4a6 6 0 0 1-12 0zM12 18v3"/></symbol>
    <symbol id="folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="seed" viewBox="0 0 24 24"><path d="M12 21v-9M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/></symbol>
    <symbol id="flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></symbol>
    <symbol id="phase" viewBox="0 0 24 24"><path d="M3 20h18M5 20V8l5 5 4-9 5 16"/></symbol>
    <symbol id="drop" viewBox="0 0 24 24"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/></symbol>
    <symbol id="bottle" viewBox="0 0 24 24"><path d="M9 3h6v4l2 3v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V10l2-3z"/></symbol>
    <symbol id="db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/><path d="M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
    <symbol id="flame" viewBox="0 0 24 24"><path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z"/></symbol>
    <symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2L5 14h6l-1 8 8-12h-6z"/></symbol>
    <symbol id="therm" viewBox="0 0 24 24"><path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/></symbol>
    <symbol id="swap" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></symbol>
    <symbol id="brick" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1"/><path d="M3 12h18M9 6v6M15 12v6"/></symbol>
    <symbol id="wave" viewBox="0 0 24 24"><path d="M3 12c3-6 5 6 9 0s6 6 9 0"/></symbol>
    <symbol id="cube" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/></symbol>
    <symbol id="mesh" viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18M5 3v18M12 3v18M19 3v18"/></symbol>
    <symbol id="movie" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></symbol>
    <symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></symbol>
    <symbol id="layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol>
    <symbol id="link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="blender" viewBox="0 0 24 24"><circle cx="13" cy="13" r="6"/><circle cx="13" cy="13" r="2"/><path d="M3 15l7-5"/></symbol>
    <symbol id="uml-c" viewBox="0 0 24 22"><rect x="6" y="2" width="16" height="18" rx="1" fill="none" stroke="#9fb2cc" stroke-width="1.4"/><rect x="2" y="6" width="8" height="3.5" fill="#0b1424" stroke="#9fb2cc" stroke-width="1.4"/><rect x="2" y="12.5" width="8" height="3.5" fill="#0b1424" stroke="#9fb2cc" stroke-width="1.4"/></symbol>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7fd4ff"/></marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#7fd4ff" stroke-width="1.6"/></marker>
  </defs>
</svg>

<svg class="links" id="links"></svg>
<div id="stage"></div>

<div class="legend">
  <span><i style="background:var(--done)"></i>done</span>
  <span><i style="background:var(--wip)"></i>in progress</span>
  <span><i style="background:var(--plan)"></i>planned</span>
  <span><i style="background:var(--risk)"></i>new data, hard to source</span>
  <span><span class="ln"></span>next phase</span>
</div>

<script>
const st = document.getElementById('stage');
const links = document.getElementById('links');

const W = 210, H = 190, X = [40, 300, 560, 820], Y1 = 120, Y2 = 380;
const phases = [
  { n: 1, x: X[0], y: Y1, st: 'application', title: 'Extractor', c: 'var(--wip)', items: [
      ['cli','CLI + API + GUI','w'], ['eye','OCR zone queries','p'], ['brain','LLM models','p'], ['gear','Parameter presets','p'] ] },
  { n: 2, x: X[1], y: Y1, st: 'database', title: 'Database', c: 'var(--plan)', items: [
      ['db','PostgreSQL','p'], ['clock','Versions + history','p'], ['swap','Translators','p'], ['seed','Seeds','p'] ] },
  { n: 3, x: X[2], y: Y1, st: 'backlog', title: 'Legacy gaps', c: 'var(--plan)', items: [
      ['drop','Salt library','p'], ['brick','Refractory mixes','p'], ['swap','Recuperator k(T)','p'], ['bottle','Quenchant tables','p'] ] },
  { n: 4, x: X[3], y: Y1, st: 'dataset', title: 'Heat-treat data', c: 'var(--risk)', items: [
      ['curve','Quench curves','r'], ['curve','CCT diagrams','r'], ['drop','Salt solutions','r'], ['bottle','Oils, polymers','r'] ] },
  { n: 5, x: X[0], y: Y2, st: 'module', title: 'Quench engine', c: 'var(--plan)', items: [
      ['phase','Boiling window','p'], ['wave','HTC models','p'], ['cube','Kondratiev','p'], ['target','Austempering','p'] ] },
  { n: 6, x: X[1], y: Y2, st: 'module', title: 'Geometry', c: 'var(--plan)', items: [
      ['cube','Plan to 3D','p'], ['mesh','Mesh + FEM','p'], ['layers','Temperature fields','p'], ['movie','Animation','p'] ] },
  { n: 7, x: X[2], y: Y2, st: 'module', title: 'Part quality', c: 'var(--plan)', items: [
      ['curve','CCT phase model','p'], ['target','Hardness, strength','p'], ['wave','Distortion','p'], ['review','Crack risk','p'] ] },
  { n: 8, x: X[3], y: Y2, st: 'module', title: 'Furnaces', c: 'var(--plan)', items: [
      ['flame','Furnace heating','p'], ['swap','Recuperators','p'], ['bolt','Efficiency','p'], ['gear','Coupled models','p'] ] },
  { n: 'R', x: 40, y: 640, w: 990, h: 100, st: 'goal', title: 'Result: heat treatment of metal parts', c: 'var(--done)', cols3: true, items: [
      ['layers','Temperature fields','p'], ['target','Final properties','p'], ['gear','Optimised process','p'] ] },
];

const icon = n => `<svg><use href="#${n}"/></svg>`;
const item = ([n, t, s]) => `<div class="it ${s}">${icon(n)}<span>${t}</span></div>`;

for (const m of phases) {
  const el = document.createElement('div');
  el.className = 'mod';
  const w = m.w || W, h = m.h || H;
  el.style.cssText = `left:${m.x}px;top:${m.y}px;width:${w}px;height:${h}px;--c:${m.c}`;
  const badge = m.n === 'R' ? '' : `<em>${m.n}</em>`;
  el.innerHTML = `<header><i>&laquo;${m.st}&raquo;</i><b>${badge}${m.title}</b><svg class="uml"><use href="#uml-c"/></svg></header><div class="body ${m.cols3 ? 'c3' : 'c1'}">${m.items.map(item).join('')}</div>`;
  st.appendChild(el);
}

const NS = 'http://www.w3.org/2000/svg';
function link(points, { label = null } = {}) {
  const p = document.createElementNS(NS, 'polyline');
  p.setAttribute('points', points.map(q => q.join(',')).join(' '));
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', '#7fd4ff');
  p.setAttribute('stroke-width', '2.2');
  p.setAttribute('marker-end', 'url(#arr)');
  links.appendChild(p);
  if (label) {
    const d = document.createElement('div');
    d.className = 'lbl';
    d.style.left = label.x + 'px';
    d.style.top = label.y + 'px';
    d.textContent = label.t;
    document.body.appendChild(d);
  }
}
const mid1 = Y1 + H / 2, mid2 = Y2 + H / 2;
const gapX = i => X[i] + W + 25;
link([[X[0] + W, mid1], [X[1], mid1]], { label: { x: gapX(0), y: mid1 - 16, t: 'feeds' } });
link([[X[1] + W, mid1], [X[2], mid1]], { label: { x: gapX(1), y: mid1 - 16, t: 'base' } });
link([[X[2] + W, mid1], [X[3], mid1]], { label: { x: gapX(2), y: mid1 - 16, t: 'adds' } });
link([[X[3] + W / 2, Y1 + H], [X[3] + W / 2, 345], [X[0] + W / 2, 345], [X[0] + W / 2, Y2]], { label: { x: 535, y: 345, t: 'data' } });
link([[X[0] + W, mid2], [X[1], mid2]], { label: { x: gapX(0), y: mid2 - 16, t: 'T(t)' } });
link([[X[1] + W, mid2], [X[2], mid2]], { label: { x: gapX(1), y: mid2 - 16, t: 'field' } });
link([[X[2] + W, mid2], [X[3], mid2]], { label: { x: gapX(2), y: mid2 - 16, t: 'feeds' } });
link([[X[2] + W / 2, Y2 + H], [X[2] + W / 2, 640]], { label: { x: X[2] + W / 2, y: 605, t: 'quality' } });
</script>
</body>
</html>
