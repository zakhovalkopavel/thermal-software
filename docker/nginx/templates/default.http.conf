# Used when docker/nginx/ssl/cert.pem is missing (fresh server / before LE).
upstream backend_api {
    server backend:4000;
    keepalive 32;
}

upstream frontend_dev {
    server frontend:5173;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/conf.d/app-locations.inc;
}
