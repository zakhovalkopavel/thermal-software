# Upstream backend API
upstream backend_api {
    server backend:4000;
    keepalive 32;
}

# Upstream frontend (Vite dev server for development)
upstream frontend_dev {
    server frontend:5173;
    keepalive 32;
}

# HTTP Server
server {
    listen 80;
    server_name localhost;

    # Docker embedded DNS — resolve SE hosts at request time so nginx can
    # start even if source-extractor-ui is still installing npm packages.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Backend API - Proxy to NestJS backend
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        # Handle OPTIONS preflight
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Source-extractor API (FastAPI under /api/v1 inside the SE container)
    location /source-extractor/api/ {
        set $se_api source-extractor:8100;
        rewrite ^/source-extractor/api/(.*)$ /api/$1 break;
        proxy_pass http://$se_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Source-extractor Swagger / OpenAPI (same origin helper)
    location /source-extractor/docs {
        set $se_api source-extractor:8100;
        proxy_pass http://$se_api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /source-extractor/redoc {
        set $se_api source-extractor:8100;
        proxy_pass http://$se_api/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /source-extractor/openapi.json {
        set $se_api source-extractor:8100;
        proxy_pass http://$se_api/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Source-extractor React GUI (Vite)
    location /source-extractor/ {
        set $se_ui source-extractor-ui:5174;
        proxy_pass http://$se_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Frontend - Proxy to Vite dev server (development mode)
    # For production, this should serve static files from /usr/share/nginx/html
    location / {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;

        # WebSocket support for HMR (Hot Module Replacement)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for better real-time updates
        proxy_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

