# Upstream backend API
upstream backend_api {
    server backend:4000;
    keepalive 32;
}

# Upstream frontend (Vite dev server for development)
upstream frontend_dev {
    server frontend:5173;
    keepalive 32;
}

# HTTP — ACME + health stay on :80; everything else redirects to HTTPS when SSL is on.
# Set ENABLE_HTTPS=0 via replacing this file only if you must stay HTTP-only without certs.
server {
    listen 80;
    server_name _;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Let's Encrypt HTTP-01 (webroot); unused until you mount a webroot for renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — requires docker/nginx/ssl/cert.pem and key.pem (see make install-ssl-certs)
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    include /etc/nginx/conf.d/app-locations.inc;
}
