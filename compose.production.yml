# Production Docker Compose — registry images where built; SE UI via Node + vendor mount.
# Usage: docker compose -f compose.production.yml up -d
# Env: make setup-production → .env from .env.production.example

services:
  # ==========================================
  # Database - PostgreSQL
  # ==========================================

  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: thermal-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - thermal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # Cache - Redis
  # ==========================================

  redis:
    image: redis:${REDIS_VERSION}
    container_name: thermal-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - thermal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # Backend - NestJS API (from registry)
  # ==========================================

  backend:
    image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/${IMAGE_PREFIX}-backend:${VERSION}
    container_name: thermal-backend
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      HTTP_PORT: ${HTTP_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      API_VERSION: ${API_VERSION}
      CORS_ORIGIN: ${CORS_ORIGIN}
    expose:
      - "${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - thermal-network
    volumes:
      - shared_data:/app/shared
    labels:
      - "app.version=${APP_VERSION}"
      - "app.name=backend"
    restart: unless-stopped

  # ==========================================
  # Frontend - React SPA (from registry)
  # ==========================================

  frontend:
    image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/${IMAGE_PREFIX}-frontend:${VERSION}
    container_name: thermal-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_APP_VERSION: ${APP_VERSION}
      VITE_PORT: ${VITE_PORT}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS}
      VITE_SOURCE_EXTRACTOR_URL: ${VITE_SOURCE_EXTRACTOR_URL}
      VITE_MAIN_APP_URL: ${VITE_MAIN_APP_URL}
    networks:
      - thermal-network
    labels:
      - "app.version=${APP_VERSION}"
      - "app.name=frontend"
    restart: unless-stopped

  # ==========================================
  # Python Scripts & OCR
  # ==========================================

  python:
    image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/${IMAGE_PREFIX}-python:${VERSION}
    container_name: thermal-python
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app/src:/app/vendor/page-ocr/src:/app/vendor/source-extract/src
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: ${QT_X11_NO_MITSHM}
      XAUTHORITY: /root/.Xauthority
      LLAMA_CPP_BINARY: /opt/llama-cpp/llama-server
      LD_LIBRARY_PATH: /opt/llama-cpp
    volumes:
      - shared_data:/app/shared
      - reports_data:/app/reports
      - python_packages:/usr/local/lib/python${PYTHON_VERSION_NUMBER}/site-packages
      - surya_model_cache:/root/.cache/datalab
      - huggingface_cache:/root/.cache/huggingface
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY}:/root/.Xauthority:ro
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thermal-network
    command: tail -f /dev/null
    labels:
      - "app.version=${APP_VERSION}"
      - "app.name=python-scripts"
    restart: unless-stopped

  # ==========================================
  # Source-extractor — CLI / API / GUI
  # ==========================================

  source-extractor:
    image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/${IMAGE_PREFIX}-python:${VERSION}
    container_name: thermal-source-extractor
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app/src:/app/vendor/page-ocr/src:/app/vendor/source-extract/src
      SE_ADAPTER_MODULES: phase_diagrams.adapter:get_adapter,yaws1999.adapter:get_adapter
      SE_WORK_ROOT: /app/reports/phase-diagrams
      SE_DATASET_ROOT: /app/shared/processed/phase-diagrams
      SE_HISTORY_ROOT: /app/reports/phase-diagrams/history
      SE_API_HOST: 0.0.0.0
      SE_API_PORT: 8100
      SE_ROOT_PATH: /source-extractor
      SE_LLM_PROVIDER: ${SE_LLM_PROVIDER}
      SE_LLM_MODEL: ${SE_LLM_MODEL}
      SE_LLM_API_KEY: ${SE_LLM_API_KEY}
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: ${QT_X11_NO_MITSHM}
      XAUTHORITY: /root/.Xauthority
      LLAMA_CPP_BINARY: /opt/llama-cpp/llama-server
      LD_LIBRARY_PATH: /opt/llama-cpp
    volumes:
      - shared_data:/app/shared
      - reports_data:/app/reports
      - surya_model_cache:/root/.cache/datalab
      - huggingface_cache:/root/.cache/huggingface
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY}:/root/.Xauthority:ro
    devices:
      - /dev/dri:/dev/dri
    networks:
      - thermal-network
    expose:
      - "8100"
    command: >
      uvicorn source_extract.api.app:app --host 0.0.0.0 --port 8100
      --root-path /source-extractor
    labels:
      - "app.version=${APP_VERSION}"
      - "app.name=source-extractor"
    restart: unless-stopped

  source-extractor-ui:
    image: node:${NODE_VERSION}
    container_name: thermal-source-extractor-ui
    working_dir: /app
    environment:
      VITE_SE_API_URL: ${VITE_SE_API_URL}
      VITE_PORT: 5174
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS}
      VITE_MAIN_APP_URL: ${VITE_MAIN_APP_URL}
    volumes:
      - ./vendor/source-extract/frontend:/app
      - se_frontend_node_modules:/app/node_modules
    networks:
      - thermal-network
    expose:
      - "5174"
    entrypoint: ["sh", "-c"]
    command:
      - "npm install && npm run dev -- --host 0.0.0.0 --port 5174 --base /source-extractor/"
    labels:
      - "app.version=${APP_VERSION}"
      - "app.name=source-extractor-ui"
    restart: unless-stopped

  # ==========================================
  # Nginx Reverse Proxy (from registry)
  # ==========================================

  nginx:
    image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/${IMAGE_PREFIX}-nginx:${VERSION}
    container_name: thermal-nginx
    environment:
      SSL_DOMAIN: ${APP_DOMAIN}
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    depends_on:
      - backend
      - frontend
      - source-extractor
      - source-extractor-ui
    networks:
      - thermal-network
    volumes:
      - ./docker/nginx/conf.d/app-locations.inc:/etc/nginx/conf.d/app-locations.inc:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    labels:
      - "app.version=${APP_VERSION}"
      - "app.name=nginx-proxy"
    restart: unless-stopped

networks:
  thermal-network:
    driver: bridge

volumes:
  postgres_data:
  python_packages:
  shared_data:
  reports_data:
  surya_model_cache:
  huggingface_cache:
  se_frontend_node_modules:
